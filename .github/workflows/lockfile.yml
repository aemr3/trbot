name: Lockfile Sync
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
permissions:
  contents: read
jobs:
  sync:
    name: Sync bun.lock
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.REPO_TOKEN }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Regenerate lockfile
        run: bun install --ignore-scripts
      - name: Inspect changes
        id: inspect
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "bun.lock is already in sync; CI failed for another reason."
            echo "sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$changed" != "bun.lock" ]; then
            echo "::error::Refusing to push. Expected only bun.lock to change, got:"
            echo "$changed"
            exit 1
          fi
          echo "sync=true" >> "$GITHUB_OUTPUT"
      - name: Commit and push bun.lock
        if: steps.inspect.outputs.sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): Sync bun.lock with package.json"
          git push origin "HEAD:${{ github.event.workflow_run.head_branch }}"
      - name: Summary
        if: steps.inspect.outputs.sync == 'true'
        run: |
          {
            echo "Regenerated \`bun.lock\` on \`${{ github.event.workflow_run.head_branch }}\`."
            echo "CI will re-run on the new commit."
          } >> "$GITHUB_STEP_SUMMARY"
